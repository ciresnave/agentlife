name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build-test:
    name: Build, test, clippy, fmt
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: cargo fmt --check
        run: cargo fmt --check

      - name: cargo clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: cargo build
        run: cargo build --all-targets

      - name: cargo test
        run: cargo test --no-fail-fast
        env:
          # The launcher's fallback through conhost.exe must really start a command on CI (a
          # developer machine where it cannot is allowed to skip that one test).
          AGENTLIFE_REQUIRE_CONHOST: ${{ matrix.os == 'windows-latest' && '1' || '0' }}
