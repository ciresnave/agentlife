[package]
name = "agentlife"
version = "0.2.1"
edition = "2021"
description = "Agent lifecycle control: bring a fleet of AI coding agents up, down and back after a restart, from a persistent roster."
license = "MIT OR Apache-2.0"
repository = "https://github.com/ciresnave/agentlife"
readme = "README.md"
keywords = ["agents", "lifecycle", "restart", "orchestration"]
categories = ["development-tools", "command-line-utilities"]

[lib]
name = "agentlife"
path = "src/lib.rs"

[[bin]]
name = "agentlife"
path = "src/main.rs"

[dependencies]
# OverMind c3935ba: the `lane-restart` library (hook machinery, parent-process walk, launch-flag
# parsing). Pinned by full SHA; both repos are public.
lane-restart = { git = "https://github.com/ciresnave/OverMind", rev = "c3935babb0ae90b7a75f84eaaf58506cb782bad3" }
chrono = { version = "0.4.45", features = ["serde"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sysinfo = { version = "0.39.6", default-features = false, features = ["system"] }

[dev-dependencies]
tempfile = "3.27.0"
