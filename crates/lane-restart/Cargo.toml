[package]
name = "lane-restart"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Restarts an idle Claude Code lane session with the same identity - self, or PM-of-idle-lane only. See RESTART-TOOL-DESIGN.md."

[dependencies]
clap = { version = "4.6.7", default-features = false, features = ["std", "derive", "error-context"] }
chrono = { version = "0.4.45", features = ["serde"] }
getrandom = "0.4.3"
hmac = "0.13.0"
lane-state.workspace = true
portable-pty = "0.9.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
sysinfo = "0.39.6"
vt100 = "0.16.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Security_Cryptography", "Win32_System_Console"] }

[target."cfg(unix)".dependencies]
rustix = { version = "1.1.5", features = ["termios", "stdio", "process"] }

[dev-dependencies]
tempfile = "3.27.0"
