# lane-restart is a published crate, so its pub items have no consumer in this repository. One entry per ITEM (`symbol`),
# not per file, each with its own reason; a new unused item in these files is still reported.
# 2026-10-31, CodeRipper 0.10.0 `reachability` (18 rows in lane-restart): five were test-only and became `#[cfg(test)]`
# (LICENSE_MIT_SHA256, LICENSE_APACHE_SHA256, watcher_count, run_with_handlers, run_with_handlers_and_window),
# `check_synapse_only` got a real caller (the end-state check in `specs synapse-only`); these twelve remain.
[reachability]
public_api = [
  { file = "src/handlers.rs", symbol = "find_matching_handler", reason = "plain form of the dialog matcher; the host calls find_matching_handler_resolved (resolver explicit) for the same job; public API of the published lane-restart crate, exercised by its tests; removing it would be a Breaking change" },
