[package]
name = "lane-state"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Reads what a Claude Code lane wrote about itself (its state file), and the pure rules for finding a lane's claude process, launch flags and home directory. Shared by lane-restart, with-secret and agentlife."

[dependencies]
chrono = { version = "0.4.45", features = ["serde"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sysinfo = "0.39.6"

[dev-dependencies]
tempfile = "3.27.0"
