# cargo-deny configuration (same shape as the portfolio's other Rust repositories).
# Read the job log: an advisory acknowledgement is the PM's call at gate, never a config edit.
[graph]
all-features = true

[advisories]
version = 2
# PM ruling 2026-11-05: ignore ONE advisory, by id, not a path. `pin-utils` is unmaintained (not a
# vulnerability); it arrives via synapse 6.0.0-rc.123 -> async-imap 0.12.0 and cannot be fixed here.
# Owner: the synapse lane (ThinkersJournal/synapse#318).
# Remove this entry when: a synapse release without async-imap 0.12.0 is the version we depend on.
ignore = [
    { id = "RUSTSEC-2026-0441", reason = "pin-utils unmaintained, transitive via synapse -> async-imap 0.12.0; owner synapse lane (synapse#318); remove once a synapse release drops async-imap 0.12.0" },
]

[licenses]
version = 2
# Allow list, read from `cargo deny list`: a new dependency whose licence expression cannot be
# satisfied from these fails the job. Dual-licensed crates (jiff, r-efi, rustix, the objc2 family)
# are satisfied by their MIT or Apache-2.0 arm; Unicode-3.0 is the ICU data and unicode-ident.
allow = [
    "MIT",
    "Apache-2.0",
    "Unicode-3.0",
    # The TLS/crypto stack under synapsed-client (ring, rustls-webpki, aws-lc-*, the dalek crates):
    # all permissive. PM ruling 2026-10-16 on #98.
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "0BSD",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
]

# MPL-2.0 is NOT allowed globally (PM ruling 2026-10-16): it is file-level copyleft, so it is allowed
# for the one crate that carries it. Unmodified dependency, notices kept; auth-framework's deny.toml
# allows it too.
[[licenses.exceptions]]
crate = "attohttpc"
allow = ["MPL-2.0"]

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
# crates.io only: no git dependencies, no other registries.
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
